<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOTOMAP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo"><svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#ffd23f"/><path d="M20 6c-5 0-9 3.8-9 8.6 0 6.4 9 15 9 15s9-8.6 9-15C29 9.8 25 6 20 6z" fill="#0b1b33"/><circle cx="20" cy="14.6" r="3.6" fill="#ffd23f"/><path d="M5 35q7.5-5 15 0t15 0" stroke="#0b1b33" stroke-width="2.2" fill="none" stroke-dasharray="3 3" stroke-linecap="round"/></svg><div><div class="wm">MOTO<b>MAP</b></div><small>FIND WHERE EVERY PART GOES</small></div></div>
    <div class="seg" role="group" aria-label="Vehicle type">
      <button id="vBike" aria-pressed="true" type="button"><svg width="24" height="16" viewBox="0 0 24 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="11" r="3.6"/><circle cx="19" cy="11" r="3.6"/><path d="M5 11l4-7h6l4 7M9 4l3 7h-0M12 11l3-7"/></svg>Bicycles</button>
      <button id="vMoto" aria-pressed="false" type="button"><svg width="26" height="16" viewBox="0 0 26 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="11.5" r="3.4"/><circle cx="21" cy="11.5" r="3.4"/><path d="M5 11.5l5-6h6l3 3 2 3M10 5.5l2 6h5M16 5.5l-1-2h-3"/></svg>Motorbikes</button>
    </div>
    <div class="head-r">
      <button class="cartbtn" id="cartBtn" type="button" aria-expanded="false"><span class="n" id="cartN">0</span><span id="cartT">₱0</span></button>
      <div class="cartpop" id="cartPop" hidden></div>
    </div>
  </header>
  <main class="layout">
    <section class="stage">
      <div class="modelbar">
        <button class="step" id="prevM" type="button" aria-label="Previous model">‹</button>
        <button class="pick" id="pickBtn" type="button" aria-haspopup="dialog"><span class="pb" id="pickBrand"></span><b id="pickName"></b><em id="pickSub"></em><span class="chev" aria-hidden="true">▾</span></button>
        <button class="step" id="nextM" type="button" aria-label="Next model">›</button>
      </div>
      <div id="view">
        <div class="tools">
          <button id="tAll" type="button">Whole bike</button>
          <button id="tX" type="button" aria-pressed="false">X-ray</button>
          <button id="tSpin" type="button" aria-pressed="true">Auto-rotate</button>
        </div>
        <div id="pin"><i></i><b id="pinLabel">Install here</b></div>
        <div class="hint">Drag to rotate · scroll or pinch to zoom · tap a part on the bike</div>
      </div>
    </section>
    <section class="detail" id="detail" aria-live="polite"></section>
    <aside class="catalog">
      <div class="cathead"><h2>Parts catalog</h2><span class="count" id="count" aria-live="polite"></span></div>
      <input class="search" id="q" type="search" placeholder="Search parts, e.g. brake, chain, light" aria-label="Search parts">
      <div class="chips" id="chips"></div>
      <div id="list"></div>
    </aside>
  </main>
  <div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="sheet">
      <div class="mhead"><h2 id="mTitle">Choose a model</h2><button class="mx" id="mClose" type="button" aria-label="Close">✕</button></div>
      <input class="search" id="mq" type="search" placeholder="Search brand or model, e.g. Honda, scooter, BMX" aria-label="Search models">
      <div class="chips" id="mBrands"></div>
      <div id="mGrid"></div>
      <p class="note">Shapes are simplified by body type, such as scooter, sport or cruiser. Colors follow each brand's usual look, but they are not exact replicas.</p>
    </div>
  </div>
</div>
<script src="vendor/three.min.js"></script>
<script src="js/catalog.js"></script>
<script src="js/models.js"></script>
<script src="js/app.js"></script>
</body>
</html>
